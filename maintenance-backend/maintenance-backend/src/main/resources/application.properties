spring.application.name=maintenance-backend
server.port=8080

# MySQL connection. Override these environment variables outside local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartschool_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Keep entity-generated schema synchronized for local development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cho phép upload ảnh chụp lỗi từ điện thoại
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini API key (set GEMINI_API_KEY in the environment)
gemini.api.key=${GEMINI_API_KEY:}