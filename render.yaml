services:
  - type: web
    name: maintenance-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./maintenance-backend/maintenance-backend/Dockerfile
    dockerContext: ./maintenance-backend/maintenance-backend
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
